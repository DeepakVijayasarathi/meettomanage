# Serves the built SPA. All non-file routes fall back to index.html so
# react-router deep links (/admin/users, /parent/billing, ...) survive refresh.
# Account pages have no search value (and /login was showing up in Google). The page itself only says
# noindex once its JavaScript runs, so say it in the HTTP header too. $request_uri keeps the original
# path after try_files rewrites to /index.html; an empty value means no header is sent.
map $request_uri $robots_header {
    default "";
    "~^/(login|forgot-pin|forgot-password|reset-pin|portal-select)(/|\?|$)" "noindex, follow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Safe to set unconditionally: no known conflict with anything the app does.
    # NOT setting X-Frame-Options/frame-ancestors here — docs/INTEGRATIONS.md documents
    # the demo-booking page being deliberately iframe-embedded on client marketing sites,
    # and a real Content-Security-Policy needs to allow the Jitsi script/iframe origin,
    # the SignalR wss:// connection, and the API origin — that needs to be built and
    # verified against a live deployment, not guessed at here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $robots_header always;

    # Teacher-reported live, on macOS: mic worked fine on Zoom/Meet but never transmitted
    # here, even after checking every OS/browser permission and trying a different mic.
    # The Jitsi call is embedded from a genuinely different origin (VITE_JITSI_DOMAIN,
    # thereadernest.co.in vs this app's own thereadernest.in) inside a cross-origin
    # iframe. Chrome largely defers to the iframe's own `allow` attribute (which
    # JitsiMeetExternalAPI sets itself) regardless of the parent page's own headers, but
    # Safari also enforces the *parent* page's Permissions-Policy: with no header here at
    # all, its default is same-origin-only, silently denying microphone/camera/screen
    # capture to that cross-origin iframe before the browser's own device permission
    # prompt is ever reached -- matching "every setting I checked says allowed" exactly,
    # since the block happens a layer above any per-site permission the user can see or
    # grant. Chrome/Zoom/Meet were never affected by this because Zoom/Meet aren't
    # embedded in a cross-origin iframe at all, and Chrome doesn't gate on the parent
    # policy the same way here.
    #
    # Every device-capture-shaped permission Jitsi's own in-call Settings panel can ask
    # for gets the same allowance, not just microphone -- camera and screen-share were
    # already covered above; speaker-selection is what lets a participant actually pick
    # which output device (a Bluetooth headset vs. the laptop's own speakers) audio plays
    # through instead of always defaulting to the system default, same cross-origin-iframe
    # restriction as the others.
    #
    # Two more hit the exact same Safari parent-policy gap: autoplay -- without it, Safari
    # can silently block remote participants' audio/video from playing back at all inside
    # the iframe, the companion failure mode to the mic one above ("I can't hear/see my
    # students" instead of "they can't hear me") -- and fullscreen, which the toolbar's own
    # fullscreen button (TOOLBAR_BUTTONS) needs to actually work cross-origin.
    #
    # nginx quirk that silently broke every one of the headers above for the one response
    # that actually matters: a location block that declares its OWN add_header discards
    # every add_header inherited from this server block entirely, not merges with it --
    # nginx has no "add to inherited" directive, only "replace inherited entirely." And a
    # plain "/" request is exactly what try_files below sends to `location = /index.html`,
    # which has its own Cache-Control add_header. Confirmed live: this file was correct
    # and freshly deployed, yet curl showed NONE of these headers on the real site -- the
    # response was actually served through that location's own add_header, silently
    # dropping the rest. Fixed by re-declaring the same headers inside both locations
    # below that set their own add_header (/index.html and /assets/), not just here.
    add_header Permissions-Policy "microphone=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), camera=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), display-capture=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), speaker-selection=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), autoplay=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), fullscreen=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\")" always;

    # Hashed build assets never change — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys take effect immediately. Also the
    # actual response path for every plain "/" request (see the nginx-quirk comment
    # above) -- these three headers MUST be repeated here, not just at the server level.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), camera=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), display-capture=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), speaker-selection=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), autoplay=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\"), fullscreen=(self \"https://meet.meettomanage.cloud\" \"https://thereadernest.co.in\")" always;
    }

    # Old URLs Google still has indexed; a page that no longer exists must not answer 200.
    location = /privacy-policy { return 301 https://meettomanage.cloud/privacy; }
    location = /forgot-password { return 301 https://meettomanage.cloud/forgot-pin; }
    # A post link shared in a sentence often picks up the full stop or bracket after it
    # ("…/blog/some-post."), which would open a not-found page; send it to the post.
    location ~ "^(/blog/[a-z0-9-]+)[.,;:!)]+$" { return 301 https://meettomanage.cloud$1; }

    # Live list of published blog posts, generated by the API from the database so a newly
    # published post is in the sitemap without a website redeploy. Served from this host
    # because sitemaps must live on the site they describe. A variable upstream is
    # resolved per request, so nginx still starts if the API's DNS is briefly unavailable.
    location = /sitemap-blog.xml {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $blog_sitemap https://api.meettomanage.cloud/api/blog/sitemap.xml;
        proxy_pass $blog_sitemap;
        proxy_set_header Host api.meettomanage.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name api.meettomanage.cloud;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # $uri.html serves the per-page metadata files written by scripts/prerender-meta.mjs.
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
