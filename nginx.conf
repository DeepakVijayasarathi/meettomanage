# Serves the built SPA. All non-file routes fall back to index.html so
# react-router deep links (/admin/users, /parent/billing, ...) survive refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Safe to set unconditionally: no known conflict with anything the app does.
    # NOT setting X-Frame-Options/frame-ancestors here — docs/INTEGRATIONS.md documents
    # the demo-booking page being deliberately iframe-embedded on client marketing sites,
    # and a real Content-Security-Policy needs to allow the Jitsi script/iframe origin,
    # the SignalR wss:// connection, and the API origin — that needs to be built and
    # verified against a live deployment, not guessed at here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Teacher-reported live, on macOS: mic worked fine on Zoom/Meet but never transmitted
    # here, even after checking every OS/browser permission and trying a different mic.
    # The Jitsi call is embedded from a genuinely different origin (VITE_JITSI_DOMAIN,
    # thereadernest.co.in vs this app's own thereadernest.in) inside a cross-origin
    # iframe. Chrome largely defers to the iframe's own `allow` attribute (which
    # JitsiMeetExternalAPI sets itself) regardless of the parent page's own headers, but
    # Safari also enforces the *parent* page's Permissions-Policy: with no header here at
    # all, its default is same-origin-only, silently denying microphone/camera/screen
    # capture to that cross-origin iframe before the browser's own device permission
    # prompt is ever reached -- matching "every setting I checked says allowed" exactly,
    # since the block happens a layer above any per-site permission the user can see or
    # grant. Chrome/Zoom/Meet were never affected by this because Zoom/Meet aren't
    # embedded in a cross-origin iframe at all, and Chrome doesn't gate on the parent
    # policy the same way here.
    #
    # Every device-capture-shaped permission Jitsi's own in-call Settings panel can ask
    # for gets the same allowance, not just microphone -- camera and screen-share were
    # already covered above; speaker-selection is what lets a participant actually pick
    # which output device (a Bluetooth headset vs. the laptop's own speakers) audio plays
    # through instead of always defaulting to the system default, same cross-origin-iframe
    # restriction as the others.
    add_header Permissions-Policy "microphone=(self \"https://thereadernest.co.in\"), camera=(self \"https://thereadernest.co.in\"), display-capture=(self \"https://thereadernest.co.in\"), speaker-selection=(self \"https://thereadernest.co.in\")" always;

    # Hashed build assets never change — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
