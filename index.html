    <script>
      // Starts the tenant lookup now, in parallel with the app bundle, instead of after it has loaded
      // (src/lib/tenantPath.ts awaits window.__m2mTenantResolve). Skipped for /t/<code> links, which
      // carry the tenant in the path and never ask.
      (function () {
        try {
          var root = "%VITE_API_BASE_URL%";
          if (root.indexOf("http") !== 0 || /^\/t\/[a-z][a-z0-9-]{2,49}(\/|$)/.test(location.pathname)) return;
          window.__m2mTenantResolve = fetch(root.replace(/\/$/, "") + "/api/tenant/resolve", { headers: { Accept: "application/json" } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        } catch (e) {}
      })();
    </script>
    <script>
      // Applies the persisted (or OS-level) theme before first paint so there's no
      // flash of the wrong theme while React boots. Keep in sync with src/lib/theme.ts,
      // which reads the same "trn.theme" key once the app mounts.
      (function () {
        try {
          var stored = localStorage.getItem("trn.theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* localStorage/matchMedia unavailable — falls back to the light default */
        }
      })();
      // Same no-flash treatment for the marketing site's language/direction — keep in
      // sync with src/lib/i18n.ts, which reads the same "trn.lang" key once mounted.
      // Unlike theme, language never auto-detects the OS/browser locale — it defaults
      // to "en" unless the visitor explicitly chose Arabic before.
      (function () {
        try {
          var storedLang = localStorage.getItem("trn.lang") === "ar" ? "ar" : "en";
          document.documentElement.dir = storedLang === "ar" ? "rtl" : "ltr";
          document.documentElement.lang = storedLang;
        } catch (e) {
          /* localStorage unavailable — falls back to the English/LTR default */
        }
      })();
    </script>

    <!-- Fonts load without blocking first paint: the stylesheet is fetched as a preload and applied

    <style>
      /* First paint for the home page, before any JavaScript has run. It is replaced the moment the app mounts
         (React clears #root), and removed at once on every other route or in Arabic. Visible to crawlers too. */
      #boot { font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1917; background: #fff; min-height: 100vh }
      #boot header { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1200px; height: 84px; margin: 0 auto; padding: 0 20px; border-bottom: 1px solid #efe3d7 }
      #boot header img { height: 64px; width: auto }
      #boot header nav { display: none; gap: 32px }
      #boot header nav a { color: #57534e; font-size: 14px; font-weight: 600; text-decoration: none }
      #boot .cta { display: inline-block; background: #c2410c; color: #fff; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none }
      #boot header .cta { padding: 12px 20px; font-size: 14px }
      #boot main { max-width: 940px; margin: 0 auto; padding: clamp(48px, 7vw, 104px) 20px; text-align: center; background: radial-gradient(60% 70% at 50% 0%, #ffe6d0, transparent) }
      #boot h1 { margin: 0; font-family: "Plus Jakarta Sans", "DM Sans", system-ui, sans-serif; font-size: clamp(1.8rem, 3.1vw, 2.7rem); line-height: 1.04; letter-spacing: -0.04em; font-weight: 800 }
      #boot h1 em { font-style: normal; color: #c2410c }
      #boot p { max-width: 640px; margin: 24px auto 0; font-size: clamp(1.0625rem, 1.5vw, 1.25rem); line-height: 1.6; color: #57534e }
      #boot main .cta { margin-top: 36px }
      @media (min-width: 1024px) {
        #boot header nav { display: flex }
        #boot main { max-width: none; text-align: start; padding-inline: max(20px, calc((100% - 1280px) / 2 + 20px)) }
        #boot h1 { max-width: 560px; font-size: clamp(1.8rem, 3.1vw, 2.7rem) }
        #boot p { margin-inline: 0; max-width: 560px }
      }
    </style>

    <script>
      (function () {
        var boot = document.getElementById("boot");
        var arabic = false;
        try { arabic = localStorage.getItem("trn.lang") === "ar"; } catch (e) {}
        if (boot && (location.pathname !== "/" || arabic)) boot.parentNode.removeChild(boot);
        // Tells the home page its headline is already on screen, so it doesn't replay the intro animation.
        else if (boot) document.documentElement.classList.add("has-boot");
      })();
    </script>
